name: oviron release

# One workflow for the three layers of the fork. The tag names the layer:
# v<upstream>-utls.<n>, v<upstream>-compat.<n>, v<upstream>-full.<n>.
on:
  push:
    tags: ["v*-utls.*", "v*-compat.*", "v*-full.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/arm64, darwin/arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Go version of the layer
        id: go
        run: |
          # the full layer has code that needs Go 1.27, the others are built like upstream
          case "$GITHUB_REF_NAME" in *-full.*) echo "version=1.27" ;; *) echo "version=1.26" ;; esac >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/} CGO_ENABLED=0
          go build -tags with_gvisor -trimpath -o mihomo -ldflags "\
            -X 'github.com/metacubex/mihomo/constant.Version=${GITHUB_REF_NAME}' \
            -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u)' \
            -w -s -buildid="
          gzip -9 -c mihomo > "mihomo-${GOOS}-${GOARCH}-${GITHUB_REF_NAME}.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ strategy.job-index }}
          path: mihomo-*.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          layer=${tag##*-}; layer=${layer%%.*}
          base=${tag%-$layer.*}
          utls=$(go list -m -f '{{.Replace.Path}} {{.Replace.Version}}' github.com/metacubex/utls)
          cd dist && sha256sum mihomo-*.gz > SHA256SUMS && cd ..
          case "$layer" in
            utls)   what="the TLS fingerprints of \`$utls\`"; doc=FORK.md ;;
            compat) what="the layer \`utls\` plus the fixes of compatibility with Xray-core servers"; doc=FORK-COMPAT.md ;;
            full)   what="the layer \`compat\` plus the client side of what an Xray-core server offers"; doc=FORK-FULL.md ;;
          esac
          printf 'Layer `%s` on upstream MetaCubeX/mihomo %s: %s.\n\nSee [%s](https://github.com/%s/blob/%s/%s) and the map of the layers in [FORK.md](https://github.com/%s/blob/%s/FORK.md).\n' \
            "$layer" "$base" "$what" "$doc" "$GITHUB_REPOSITORY" "$tag" "$doc" "$GITHUB_REPOSITORY" "$tag" > notes.md
          # the layer in daily use is the one GitHub shows as the latest release
          latest=false; [ "$layer" = compat ] && latest=true
          gh release create "$tag" dist/* --verify-tag --title "$tag" --notes-file notes.md --latest="$latest"
